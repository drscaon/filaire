name: Release

# Pushing a tag vX.Y.Z (or a pre-release tag such as v0.2.0b1) builds the
# packages and publishes them on the GitHub release for that tag. Pre-release
# versions (a, b, rc) are marked as pre-releases. If the release already exists
# (for example created from the GitHub web page), the packages are added to it.
# The Python packages are then published on PyPI (job `pypi`).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $VERSION in pyproject.toml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
          filaire blender-addon --out dist/filaire_physics.zip

      - name: Keep the Python packages for the PyPI job
        uses: actions/upload-artifact@v7
        with:
          name: python-packages
          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Release notes from CHANGELOG.md
        run: |
          python - <<'EOF'
          import os, re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          notes = match.group(1).strip() if match else f"Filaire {version}"
          open("release-notes.md", "w", encoding="utf-8").write(notes + "\n")
          EOF

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if echo "$VERSION" | grep -Eq '(a|b|rc)[0-9]+$'; then PRERELEASE="--prerelease"; fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* $PRERELEASE \
              --title "Filaire $VERSION" --notes-file release-notes.md --verify-tag
          fi

  # Trusted Publishing: no API token. One-time setup on pypi.org, Account >
  # Publishing > add a pending publisher: project "filaire", owner "drscaon",
  # repository "filaire", workflow "release.yml", environment "pypi"; and create
  # the "pypi" environment in Settings > Environments (restrict it to tags v*).
  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/filaire
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-packages
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
