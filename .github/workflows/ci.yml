name: CI

# Two levels. On a commit (push to main, pull request): the fast tests (pytest -m "not
# slow") on Ubuntu and Python 3.12, and the engine checks on a sample of the presets
# (.github/ci_presets.py). Before a release (release.yml calls this workflow with
# full: true) and with the "Run workflow" button: every test on Linux, Windows and macOS
# and on every Python, the oldest OpenUSD, and the engine checks on every preset.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Every test, platform and preset (as before a release)
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        description: Every test, platform and preset
        type: boolean
        default: true

permissions:
  contents: read

env:
  FULL: ${{ inputs.full && 'true' || 'false' }}  # read by .github/ci_presets.py and the steps

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    # lint and format, tests on every Python and platform, oldest OpenUSD, package build:
    # the same in the four generators, written once in the primvaria repository
    uses: drscaon/primvaria/.github/workflows/generator-checks.yml@main
    with:
      full: ${{ inputs.full || false }}
      package: filaire
      smoke: |
        filaire --version
        filaire list
        filaire ends
        filaire generate --preset usb_c --count 2 --out ci-output
        filaire generate --preset power_c13 --count 2 --length 0.5 --end-a c13_plug --end-b stripped --layout coil --out ci-output
        filaire generate --preset dc_barrel --count 2 --no-physics --out ci-output
        filaire blender-addon --out ci-output/filaire_physics.zip
        python -m filaire.validate ci-output/usb_c ci-output/dc_barrel
        filaire preview ci-output/usb_c

  sim:
    name: MuJoCo checks of the presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[sim]"
      - name: Generate and check the presets
        run: |
          status=0
          for preset in $(python .github/ci_presets.py filaire); do
            filaire generate --preset "$preset" --count 2 --out ci-output > /dev/null
            filaire sim-test "ci-output/$preset" --cables 2 || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-test-reports
          path: ci-output/*/sim_test/sim_test.json
          retention-days: 14

  blender:
    name: Blender checks of the presets (add-on)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"  # the bpy module is built for one Python version
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for bpy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Install
        run: pip install -e ".[blender]"
      - name: Drop checks through the add-on
        run: |
          status=0
          for preset in $(python .github/ci_presets.py filaire); do
            filaire generate --preset "$preset" --count 2 --out ci-output > /dev/null
            filaire blender-test "ci-output/$preset" --cables 2 || status=1
          done
          exit $status
      - name: The same, rigid bodies set by hand (for comparison, not a gate)
        run: |
          for preset in usb_c power_c13 coiled_handset; do
            filaire blender-test "ci-output/$preset" --mode naive
          done
      - name: Visual-only assets
        run: |
          filaire generate --preset hdmi --count 2 --no-physics --out ci-visual
          python -m filaire.validate ci-visual/hdmi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-test-blender
          path: ci-output/*/sim_test/blender_*.json
          retention-days: 14


  openusd:
    name: OpenUSD validators of the presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Generate the presets, with and without physics
        run: |
          for preset in $(python .github/ci_presets.py filaire.catalog); do
            filaire generate --preset "$preset" --count 2 --out ci-usd > /dev/null
            filaire generate --preset "$preset" --count 1 --no-physics --out ci-usd-visual > /dev/null
          done
      - name: Validate every file (what usdchecker runs)
        run: python -m filaire.validate ci-usd ci-usd-visual
      - name: Check every file against the Primvaria contract
        run: python -m filaire.conformance ci-usd ci-usd-visual
      - name: PhysX layers (structure; not simulated)
        run: python -m filaire.physx ci-usd
