name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.8"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # one run on each other platform, on a recent Python
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Command-line smoke test
        run: |
          filaire --version
          filaire list
          filaire ends
          filaire generate --preset usb_c --count 2 --out ci-output
          filaire generate --preset power_c13 --count 2 --length 0.5 --end-a c13_plug --end-b stripped --layout coil --out ci-output
          filaire generate --preset dc_barrel --count 2 --no-physics --out ci-output
          filaire blender-addon --out ci-output/filaire_physics.zip
          python -c "from filaire.validate import validate; import sys; m = [x for f in ('ci-output/usb_c/filaire_usb_c.usdc', 'ci-output/usb_c/sockets.usdc', 'ci-output/dc_barrel/filaire_dc_barrel.usdc') for x in validate(f)]; print(m); sys.exit(bool(m))"
          filaire preview ci-output/usb_c

  sim:
    name: MuJoCo checks of every preset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[sim]"
      - name: Generate and check every preset
        run: |
          status=0
          for preset in $(python -c "import filaire; print(' '.join(filaire.PRESETS))"); do
            filaire generate --preset "$preset" --count 2 --out ci-output > /dev/null
            filaire sim-test "ci-output/$preset" --cables 2 || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-test-reports
          path: ci-output/*/sim_test/sim_test.json
          retention-days: 14

  blender:
    name: Blender checks of every preset (add-on)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"  # the bpy module is built for one Python version
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for bpy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Install
        run: pip install -e ".[blender]"
      - name: Drop checks through the add-on
        run: |
          status=0
          for preset in $(python -c "import filaire; print(' '.join(filaire.PRESETS))"); do
            filaire generate --preset "$preset" --count 2 --out ci-output > /dev/null
            filaire blender-test "ci-output/$preset" --cables 2 || status=1
          done
          exit $status
      - name: The same, rigid bodies set by hand (for comparison, not a gate)
        run: |
          for preset in usb_c power_c13 coiled_handset; do
            filaire blender-test "ci-output/$preset" --mode naive
          done
      - name: Visual-only assets
        run: |
          filaire generate --preset hdmi --count 2 --no-physics --out ci-visual
          python -c "from filaire.validate import validate; import sys; m = validate('ci-visual/hdmi/filaire_hdmi.usdc'); print(m); sys.exit(bool(m))"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-test-blender
          path: ci-output/*/sim_test/blender_*.json
          retention-days: 14


  openusd:
    name: OpenUSD validators of every preset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Generate every preset, with and without physics
        run: |
          for preset in $(python -c "from filaire.catalog import PRESETS; print(' '.join(PRESETS))"); do
            filaire generate --preset "$preset" --count 2 --out ci-usd > /dev/null
            filaire generate --preset "$preset" --count 1 --no-physics --out ci-usd-visual > /dev/null
          done
      - name: Validate every file (what usdchecker runs)
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from filaire.validate import validate
          files = sorted(f for d in ("ci-usd", "ci-usd-visual") for f in Path(d).rglob("*.usdc"))
          bad = {str(f): m for f in files if (m := validate(f))}
          for f, m in bad.items():
              print(f, m)
          print(f"{len(files)} OpenUSD files checked, {len(bad)} with issues")
          sys.exit(1 if bad or not files else 0)
          PY

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Check package metadata
        run: twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/filaire --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
